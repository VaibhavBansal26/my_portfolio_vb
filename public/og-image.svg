<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0e0e0e"/>
  <!-- Grid -->
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(232,168,56,0.06)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- Amber glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgba(232,168,56,0.15)"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Left accent line -->
  <rect x="80" y="0" width="2" height="630" fill="url(#lineGrad)"/>
  <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="40%" stop-color="#e8a838"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <!-- VB Avatar circle -->
  <circle cx="220" cy="315" r="110" fill="none" stroke="#e8a838" stroke-width="2"/>
  <circle cx="220" cy="315" r="90" fill="rgba(232,168,56,0.08)"/>
  <text x="220" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#e8a838">VB</text>
  <!-- Name -->
  <text x="400" y="260" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#f0ece4">Vaibhav Bansal</text>
  <!-- Role -->
  <text x="402" y="320" font-family="monospace" font-size="24" fill="#e8a838">AI Engineer · Software Developer</text>
  <!-- Divider -->
  <rect x="400" y="345" width="120" height="2" fill="#e8a838"/>
  <!-- Tags -->
  <text x="402" y="390" font-family="monospace" font-size="18" fill="rgba(232,168,56,0.6)">LangChain · RAG · Python · React · AWS</text>
  <text x="402" y="420" font-family="monospace" font-size="18" fill="rgba(232,168,56,0.6)">5+ Years Experience · M.S. Data Science · United States</text>
  <!-- URL -->
  <text x="402" y="490" font-family="monospace" font-size="16" fill="rgba(232,168,56,0.35)">thevaibhavbansal.com</text>
  <!-- Corner brackets -->
  <path d="M 40 40 L 40 20 L 60 20" fill="none" stroke="rgba(232,168,56,0.5)" stroke-width="2"/>
  <path d="M 1160 40 L 1160 20 L 1140 20" fill="none" stroke="rgba(232,168,56,0.5)" stroke-width="2"/>
  <path d="M 40 590 L 40 610 L 60 610" fill="none" stroke="rgba(232,168,56,0.5)" stroke-width="2"/>
  <path d="M 1160 590 L 1160 610 L 1140 610" fill="none" stroke="rgba(232,168,56,0.5)" stroke-width="2"/>
</svg>
